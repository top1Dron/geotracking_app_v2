<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geo Tracking</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>Geo Tracking</h1>
        <p class="subtitle">Live device locations and geozone alerts</p>
        <label for="user-id">User ID</label>
        <input id="user-id" type="text" placeholder="demo-user" />
        <label for="radius">Radius (m)</label>
        <input id="radius" type="number" min="1" max="50000" step="0.01" value="500.00" />
        <button id="save-user" type="button">Save User</button>
        <button id="reload-zones" type="button">Reload Geozones</button>
        <p class="hint">Click map to create a geozone center.</p>
        <ul id="alerts" class="alerts"></ul>
      </section>
      <section class="map-wrap">
        <div id="map"></div>
      </section>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/js/app.js" defer></script>
  </body>
  </html>
